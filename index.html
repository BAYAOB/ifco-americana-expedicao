<script>
    // =========================================================================
    // CONFIGURAÇÃO E ESTADO GLOBAL (V3 MULTI-FILIAL BLINDADO MOBILE)
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaSH6HpGUX27waLqdqUN8V4DAKvR4kSqLhkDlBTcdgycF7Bz0WZIvAWgpuZEA2Dq8o/exec";
    const PLANILHA_URL = "https://docs.google.com/spreadsheets";
    const SENHA_GESTAO = "ifco2026";

    const SENHAS_FILIAIS = {
      "AMERICANA": "am2026",
      "JUNDIAI": "ju2026",
      "CAJAMAR": "ca2026",
      "BETIM": "be2026",
      "DEFAULT": "ifco2026"
    };

    let todosPedidos = [];
    let itensCadastroTemp = [];
    let pedidoAtivoFaturista = null;
    let pedidoAtivoOperador = null;
    let filialOperadorLogada = "";
    let npsSelecionado = "";
    let fotoBase64Resumo = "";
    let qrScannerAgenda = null;
    let wakeLock = null;

    function strLower(val) {
      return String(val ?? "").trim().toLowerCase();
    }

    function normalizarTexto(txt) {
      return String(txt ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toUpperCase();
    }

    function limparHoraExibicao(val) {
      const s = String(val ?? "").trim();
      if (!s) return "-";
      const match = s.match(/(\d{2}:\d{2}:\d{2})/);
      return match ? match[1] : s;
    }

    function formatarDataBr(isoStr) {
      const s = String(isoStr ?? "").trim();
      if (!s) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        const [ano, mes, dia] = s.split("-");
        return `${dia}/${mes}/${ano}`;
      }
      return s;
    }

    function definirDataHojeInput() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      document.getElementById("cadData").value = `${ano}-${mes}-${dia}`;
    }

    // =========================================================================
    // BLINDAGEM DE SESSÃO E TELA ATIVA (EVITA PERDA NO CELULAR DO OPERADOR)
    // =========================================================================
    async function ativarTelaSempreLigada() {
      try {
        if ("wakeLock" in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
      } catch (e) { /* Ignora se bateria fraca ou navegador sem suporte */ }
    }

    function liberarTelaSempreLigada() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    function salvarEstadoRomaneioLocal() {
      if (!pedidoAtivoOperador) return;
      const checkboxes = Array.from(document.querySelectorAll("#opChecklistItens input[type='checkbox']")).map(cb => cb.checked);
      const estado = {
        pedidoObj: pedidoAtivoOperador,
        checkboxes,
        nps: npsSelecionado,
        foto: fotoBase64Resumo
      };
      localStorage.setItem("ifco_v3_op_ativo", JSON.stringify(estado));
    }

    // Reativa WakeLock quando o operador desbloqueia o celular sem resetar a tela
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && pedidoAtivoOperador) {
        ativarTelaSempreLigada();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("linkPlanilhaDireto").href = PLANILHA_URL;
      definirDataHojeInput();

      const savedOpRaw = localStorage.getItem("ifco_v3_op_ativo");
      const savedPerfil = localStorage.getItem("ifco_v3_perfil_atual");
      const savedFilial = localStorage.getItem("ifco_v3_filial_op");

      if (savedPerfil === "faturista") {
        abrirPerfil("faturista");
      } else if ((savedPerfil === "operador" || savedOpRaw) && savedFilial) {
        filialOperadorLogada = savedFilial;
        abrirPerfil("operador");
        if (savedOpRaw) {
          try {
            const parsed = JSON.parse(savedOpRaw);
            const pedidoObj = parsed.pedidoObj ? parsed.pedidoObj : parsed;
            abrirRomaneioOperador(pedidoObj, true, parsed);
          } catch (e) {
            localStorage.removeItem("ifco_v3_op_ativo");
          }
        }
      }
    });

    // =========================================================================
    // LOGIN DO OPERADOR POR FILIAL
    // =========================================================================
    function abrirModalLoginOperador() {
      const savedFilial = localStorage.getItem("ifco_v3_filial_op");
      if (savedFilial) {
        filialOperadorLogada = savedFilial;
        abrirPerfil("operador");
        return;
      }
      document.getElementById("inputLoginFilial").value = "";
      document.getElementById("inputSenhaFilial").value = "";
      const modal = document.getElementById("modalLoginOperador");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      setTimeout(() => document.getElementById("inputLoginFilial").focus(), 100);
    }

    function fecharModalLoginOperador() {
      const modal = document.getElementById("modalLoginOperador");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function validarLoginOperador() {
      const filialDigitada = document.getElementById("inputLoginFilial").value.trim().toUpperCase();
      const senhaDigitada = document.getElementById("inputSenhaFilial").value.trim();

      if (!filialDigitada) {
        return mostrarToast("Informe o nome da filial!", true);
      }

      const chave = normalizarTexto(filialDigitada);
      const senhaEsperada = SENHAS_FILIAIS[chave] || SENHAS_FILIAIS["DEFAULT"];

      if (senhaDigitada !== senhaEsperada) {
        return mostrarToast("Senha incorreta para esta filial!", true);
      }

      filialOperadorLogada = filialDigitada;
      localStorage.setItem("ifco_v3_filial_op", filialDigitada);
      fecharModalLoginOperador();
      abrirPerfil("operador");
    }

    function trocarFilialOperador() {
      liberarTelaSempreLigada();
      localStorage.removeItem("ifco_v3_filial_op");
      localStorage.removeItem("ifco_v3_op_ativo");
      filialOperadorLogada = "";
      pedidoAtivoOperador = null;
      document.getElementById("viewOperador").classList.add("hidden");
      abrirModalLoginOperador();
    }

    // =========================================================================
    // ÁREA RESTRITA (SENHA -> ABRE TELA DE RELATÓRIO)
    // =========================================================================
    function abrirModalRestrito() {
      document.getElementById("inputSenhaRestrita").value = "";
      const modal = document.getElementById("modalRestrito");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      setTimeout(() => document.getElementById("inputSenhaRestrita").focus(), 100);
    }

    function fecharModalRestrito() {
      const modal = document.getElementById("modalRestrito");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    async function validarSenhaRestrita() {
      const digitada = document.getElementById("inputSenhaRestrita").value.trim();
      if (digitada !== SENHA_GESTAO) {
        return mostrarToast("Senha incorreta!", true);
      }
      fecharModalRestrito();
      document.getElementById("viewMenu").classList.add("hidden");
      document.getElementById("viewFaturista").classList.add("hidden");
      document.getElementById("viewOperador").classList.add("hidden");
      document.getElementById("viewRelatorio").classList.remove("hidden");
      document.getElementById("btnMenuTop").classList.remove("hidden");
      await carregarDados();
    }

    function renderizarRelatorio() {
      const tbody = document.getElementById("tbodyRelatorio");
      const termo = strLower(document.getElementById("buscaRelatorio").value);

      const filtrados = todosPedidos.filter(p => {
        if (!termo) return true;
        return (
          strLower(p.pedido).includes(termo) ||
          strLower(p.filial).includes(termo) ||
          strLower(p.cliente).includes(termo) ||
          strLower(p.nf).includes(termo) ||
          strLower(p.itens).includes(termo) ||
          strLower(p.status).includes(termo) ||
          strLower(p.agendamento).includes(termo) ||
          strLower(p.data).includes(termo)
        );
      });

      document.getElementById("relatorioCount").textContent = filtrados.length;

      if (filtrados.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="12" class="py-10 text-center text-slate-400 text-sm">
              Nenhum registro encontrado na planilha.
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = filtrados.map(p => {
        const st = strLower(p.status);
        let badgeClass = "bg-slate-100 text-slate-700";
        if (st === "concluído" || st === "concluido") badgeClass = "bg-emerald-100 text-emerald-800";
        else if (st === "agendado") badgeClass = "bg-blue-100 text-blue-800";
        else if (st.includes("faturamento") || st.includes("separação")) badgeClass = "bg-amber-100 text-amber-800";

        const pedidoCliente = p.cliente ? `#${p.pedido} • ${p.cliente}` : `#${p.pedido}`;
        const npsVal = p.nps ? `${p.nps} ★` : "-";

        return `
          <tr class="hover:bg-slate-50 transition whitespace-nowrap">
            <td class="py-3 px-3.5 font-extrabold text-slate-800">${pedidoCliente}</td>
            <td class="py-3 px-3.5">
              <span class="px-2 py-0.5 rounded bg-slate-800 text-white text-[10px] font-extrabold uppercase">${p.filial || "-"}</span>
            </td>
            <td class="py-3 px-3.5 font-semibold text-slate-600">${p.agendamento || p.data || "-"}</td>
            <td class="py-3 px-3.5 font-bold text-[#007A33]">${p.nf || "-"}</td>
            <td class="py-3 px-3.5 font-medium text-slate-700">${p.itens || "-"}</td>
            <td class="py-3 px-3.5">
              <span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold ${badgeClass}">
                ${p.status || "-"}
              </span>
            </td>
            <td class="py-3 px-3.5 font-mono text-slate-600">${limparHoraExibicao(p.t_inicio)}</td>
            <td class="py-3 px-3.5 font-mono text-slate-600">${limparHoraExibicao(p.t_nf)}</td>
            <td class="py-3 px-3.5 font-mono text-slate-600">${limparHoraExibicao(p.t_sep_ini)}</td>
            <td class="py-3 px-3.5 font-mono text-slate-600">${limparHoraExibicao(p.t_fim)}</td>
            <td class="py-3 px-3.5 font-extrabold text-slate-800">${p.tempo_total || "-"}</td>
            <td class="py-3 px-3.5 text-center font-extrabold text-amber-500">${npsVal}</td>
          </tr>
        `;
      }).join("");
    }

    // =========================================================================
    // NAVEGAÇÃO ENTRE PERFIS
    // =========================================================================
    function abrirPerfil(perfil) {
      localStorage.setItem("ifco_v3_perfil_atual", perfil);
      document.getElementById("viewMenu").classList.add("hidden");
      document.getElementById("viewRelatorio").classList.add("hidden");
      document.getElementById("btnMenuTop").classList.remove("hidden");

      if (perfil === "faturista") {
        document.getElementById("viewFaturista").classList.remove("hidden");
        document.getElementById("viewOperador").classList.add("hidden");
        mudarAbaFaturista("fila");
      } else {
        document.getElementById("opFilialHeader").textContent = filialOperadorLogada;
        document.getElementById("viewOperador").classList.remove("hidden");
        document.getElementById("viewFaturista").classList.add("hidden");
      }

      carregarDados();
    }

    function voltarMenu() {
      // Se o operador tem um romaneio aberto em andamento, pede confirmação para não sair sem querer
      if (pedidoAtivoOperador) {
        const confirmar = confirm("Você tem um carregamento aberto em andamento. Deseja realmente voltar ao menu inicial?");
        if (!confirmar) return;
      }
      pararQrAgenda();
      liberarTelaSempreLigada();
      localStorage.removeItem("ifco_v3_perfil_atual");
      document.getElementById("viewMenu").classList.remove("hidden");
      document.getElementById("viewFaturista").classList.add("hidden");
      document.getElementById("viewOperador").classList.add("hidden");
      document.getElementById("viewRelatorio").classList.add("hidden");
      document.getElementById("btnMenuTop").classList.add("hidden");
    }

    // =========================================================================
    // COMUNICAÇÃO COM GOOGLE SHEETS
    // =========================================================================
    async function carregarDados() {
      toggleSync(true);
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        todosPedidos = Array.isArray(data) ? data : [];
        renderizarTabelaAgendados();
        renderizarFilaOperador();
        renderizarRelatorio();
      } catch (err) {
        console.error(err);
        mostrarToast("Erro ao buscar dados da planilha", true);
      } finally {
        toggleSync(false);
      }
    }

    async function enviarPost(payload) {
      toggleSync(true);
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        return true;
      } catch (err) {
        console.error(err);
        mostrarToast("Falha de conexão ao salvar", true);
        return false;
      } finally {
        toggleSync(false);
      }
    }

    // =========================================================================
    // LÓGICA DO FATURISTA (HUB BRASIL: VÊ TODAS AS FILIAIS)
    // =========================================================================
    function mudarAbaFaturista(aba) {
      pararQrAgenda();

      document.getElementById("fatSubFila").classList.add("hidden");
      document.getElementById("fatSubCadastrar").classList.add("hidden");
      document.getElementById("fatSubAtivo").classList.add("hidden");

      const btnFila = document.getElementById("tabFatFila");
      const btnCad = document.getElementById("tabFatCadastrar");

      btnFila.className = "px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100 transition flex items-center gap-2";
      btnCad.className = "px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100 transition flex items-center gap-2";

      if (aba === "fila") {
        document.getElementById("fatSubFila").classList.remove("hidden");
        btnFila.className = "px-4 py-2 rounded-lg text-sm font-bold ifco-green text-white transition flex items-center gap-2";
      } else if (aba === "cadastrar") {
        document.getElementById("fatSubCadastrar").classList.remove("hidden");
        btnCad.className = "px-4 py-2 rounded-lg text-sm font-bold ifco-green text-white transition flex items-center gap-2";
      } else if (aba === "ativo") {
        document.getElementById("fatSubAtivo").classList.remove("hidden");
        document.getElementById("tabFatAtivo").classList.remove("hidden");
      }
    }

    function renderizarTabelaAgendados() {
      const tbody = document.getElementById("tbodyAgendados");
      const termo = strLower(document.getElementById("buscaAgendados").value);

      const agendados = todosPedidos.filter(p => {
        const st = strLower(p.status);
        const matchStatus = st === "agendado" || st === "em faturamento";
        const matchBusca = !termo ||
          strLower(p.pedido).includes(termo) ||
          strLower(p.filial).includes(termo) ||
          strLower(p.cliente).includes(termo) ||
          strLower(p.itens).includes(termo);
        return matchStatus && matchBusca;
      });

      document.getElementById("badgeCountAgendados").textContent = agendados.length;

      if (agendados.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="py-10 text-center text-slate-400 text-sm">
              <i class="fa-regular fa-calendar-xmark text-2xl mb-2 block"></i>
              Nenhum pedido agendado aguardando no momento.<br/>
              <button onclick="mudarAbaFaturista('cadastrar')" class="mt-2 text-xs font-bold ifco-text underline">+ Cadastrar novo agendamento</button>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = agendados.map(p => {
        const emAtendimento = strLower(p.status) === "em faturamento";
        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3.5 px-4 font-extrabold text-slate-800">#${p.pedido}</td>
            <td class="py-3.5 px-4">
              <span class="inline-block bg-slate-800 text-white text-[11px] font-extrabold px-2.5 py-1 rounded-md uppercase">
                ${p.filial || "GERAL"}
              </span>
            </td>
            <td class="py-3.5 px-4 text-xs font-semibold text-slate-600">${p.agendamento || p.data || "Hoje"}</td>
            <td class="py-3.5 px-4 font-bold text-slate-800">${p.cliente || "Cliente não informado"}</td>
            <td class="py-3.5 px-4">
              <span class="inline-block bg-emerald-50 text-[#007A33] border border-emerald-200 text-xs font-extrabold px-2.5 py-1 rounded-lg">
                ${p.itens || "-"}
              </span>
            </td>
            <td class="py-3.5 px-4 text-right">
              <button onclick='iniciarAtendimento(${JSON.stringify(p).replace(/'/g, "&apos;")})'
                class="${emAtendimento ? 'bg-amber-500 hover:bg-amber-600' : 'ifco-green hover:ifco-green-dark'} text-white text-xs font-extrabold px-4 py-2.5 rounded-xl shadow-sm transition inline-flex items-center gap-1.5">
                <i class="fa-solid ${emAtendimento ? 'fa-arrow-right' : 'fa-play'}"></i>
                ${emAtendimento ? 'Continuar NF' : 'Iniciar Atendimento'}
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function adicionarItemCadastro() {
      const modelo = document.getElementById("cadModeloInput").value.trim().toUpperCase();
      const qtd = document.getElementById("cadQtdInput").value;
      if (!modelo || !qtd || Number(qtd) <= 0) {
        return mostrarToast("Digite o modelo e informe a quantidade", true);
      }
      itensCadastroTemp.push({ modelo, qtd: Number(qtd) });
      document.getElementById("cadModeloInput").value = "";
      document.getElementById("cadQtdInput").value = "";
      document.getElementById("cadModeloInput").focus();
      renderizarItensCadastro();
    }

    function removerItemCadastro(idx) {
      itensCadastroTemp.splice(idx, 1);
      renderizarItensCadastro();
    }

    function renderizarItensCadastro() {
      const container = document.getElementById("listaItensCadastro");
      if (itensCadastroTemp.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 italic">Nenhum item adicionado ainda.</p>`;
        return;
      }
      container.innerHTML = itensCadastroTemp.map((item, idx) => `
        <div class="flex items-center justify-between bg-white px-3 py-2 rounded-lg border border-slate-200 text-xs font-bold">
          <span>Modelo <span class="ifco-text">${item.modelo}</span> — ${item.qtd} caixas</span>
          <button onclick="removerItemCadastro(${idx})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join("");
    }

    async function salvarAgendamento() {
      const pedido = document.getElementById("cadPedidoId").value.trim();
      const filial = document.getElementById("cadFilial").value.trim().toUpperCase();
      const dataIso = document.getElementById("cadData").value;
      const agendamento = formatarDataBr(dataIso);
      const cliente = document.getElementById("cadCliente").value.trim();

      if (!pedido || !filial || !cliente || !agendamento) {
        return mostrarToast("Preencha Pedido, Filial, Cliente e Data!", true);
      }
      if (itensCadastroTemp.length === 0) {
        return mostrarToast("Adicione pelo menos um modelo e quantidade", true);
      }

      const itensFormatado = itensCadastroTemp.map(i => `${i.modelo} (${i.qtd})`).join(" | ");

      const ok = await enviarPost({
        action: "agendar",
        pedido,
        filial,
        agendamento,
        cliente,
        itens: itensFormatado
      });

      if (ok) {
        todosPedidos.unshift({
          pedido,
          status: "Agendado",
          filial,
          agendamento,
          data: agendamento,
          cliente,
          itens: itensFormatado
        });

        document.getElementById("cadPedidoId").value = "";
        document.getElementById("cadFilial").value = "";
        document.getElementById("cadCliente").value = "";
        definirDataHojeInput();
        itensCadastroTemp = [];
        renderizarItensCadastro();

        mostrarToast(`Agendamento registrado para ${filial}!`);
        mudarAbaFaturista("fila");
        renderizarTabelaAgendados();
        setTimeout(carregarDados, 1500);
      }
    }

    function toggleQrAgenda() {
      const container = document.getElementById("qrReaderAgendaContainer");
      if (!container.classList.contains("hidden")) {
        pararQrAgenda();
        return;
      }
      container.classList.remove("hidden");
      document.getElementById("txtBtnQrAgenda").textContent = "Fechar Câmera";

      qrScannerAgenda = new Html5Qrcode("qrReaderAgenda");
      qrScannerAgenda.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        (decodedText) => {
          pararQrAgenda();
          processarQrCodeLido(decodedText);
        }
      ).catch(() => {
        mostrarToast("Não foi possível acessar a câmera", true);
        pararQrAgenda();
      });
    }

    function pararQrAgenda() {
      const container = document.getElementById("qrReaderAgendaContainer");
      container.classList.add("hidden");
      document.getElementById("txtBtnQrAgenda").textContent = "Abrir Leitor de QR Code";
      if (qrScannerAgenda) {
        qrScannerAgenda.stop().catch(() => {});
        qrScannerAgenda = null;
      }
    }

    function processarQrCodeLido(texto) {
      try {
        const obj = JSON.parse(texto);
        if (obj.pedido) document.getElementById("cadPedidoId").value = obj.pedido;
        if (obj.filial) document.getElementById("cadFilial").value = String(obj.filial).toUpperCase();
        if (obj.cliente) document.getElementById("cadCliente").value = obj.cliente;
        if (obj.itens && Array.isArray(obj.itens)) {
          itensCadastroTemp = obj.itens;
          renderizarItensCadastro();
        }
        mostrarToast("QR Code lido! Confira e clique em Registrar.");
      } catch (e) {
        const matchNum = texto.match(/\d{4,10}/);
        document.getElementById("cadPedidoId").value = matchNum ? matchNum[0] : texto;
        mostrarToast("Código lido! Complete filial/cliente e registre.");
      }
    }

    async function iniciarAtendimento(pedidoObj) {
      const agoraStr = horaAtualFormatada();
      pedidoAtivoFaturista = { ...pedidoObj, t_inicio: limparHoraExibicao(pedidoObj.t_inicio) !== "-" ? limparHoraExibicao(pedidoObj.t_inicio) : agoraStr };

      document.getElementById("ativoPedidoId").textContent = pedidoAtivoFaturista.pedido;
      document.getElementById("ativoFilialBadge").textContent = pedidoAtivoFaturista.filial || "GERAL";
      document.getElementById("ativoClienteNome").textContent = pedidoAtivoFaturista.cliente || "Cliente";
      document.getElementById("ativoHoraInicio").textContent = pedidoAtivoFaturista.t_inicio;
      document.getElementById("ativoItensResumo").textContent = pedidoAtivoFaturista.itens || "-";
      document.getElementById("ativoInputNf").value = "";

      mudarAbaFaturista("ativo");
      setTimeout(() => document.getElementById("ativoInputNf").focus(), 150);

      if (strLower(pedidoObj.status) === "agendado") {
        pedidoObj.status = "Em Faturamento";
        pedidoObj.t_inicio = agoraStr;
        renderizarTabelaAgendados();

        await enviarPost({
          action: "iniciar_atendimento",
          pedido: pedidoObj.pedido,
          t_inicio: agoraStr
        });
      }
    }

    async function enviarParaExpedicao() {
      if (!pedidoAtivoFaturista) return;
      const nf = document.getElementById("ativoInputNf").value.trim();
      if (!nf) {
        return mostrarToast("Bipe ou digite o número da NF antes de enviar!", true);
      }

      const tNf = horaAtualFormatada();
      const ok = await enviarPost({
        action: "enviar_expedicao",
        pedido: pedidoAtivoFaturista.pedido,
        itens: pedidoAtivoFaturista.itens,
        nf: nf,
        t_inicio: pedidoAtivoFaturista.t_inicio,
        t_nf: tNf
      });

      if (ok) {
        todosPedidos = todosPedidos.map(p =>
          String(p.pedido) === String(pedidoAtivoFaturista.pedido)
            ? { ...p, status: "Aguardando Separação", nf, t_nf: tNf }
            : p
        );
        const filialDestino = pedidoAtivoFaturista.filial || "Doca";
        pedidoAtivoFaturista = null;
        document.getElementById("tabFatAtivo").classList.add("hidden");
        mostrarToast(`NF registrada! Enviado para a doca de ${filialDestino}.`);
        mudarAbaFaturista("fila");
        renderizarTabelaAgendados();
        setTimeout(carregarDados, 1500);
      }
    }

    // =========================================================================
    // LÓGICA DO OPERADOR LOGÍSTICO (FILTRADO EXCLUSIVAMENTE PELA FILIAL)
    // =========================================================================
    function renderizarFilaOperador() {
      const container = document.getElementById("opListaPedidos");
      const filialAlvo = normalizarTexto(filialOperadorLogada);

      const fila = todosPedidos.filter(p => {
        const st = strLower(p.status);
        const statusValido = st === "aguardando separação" || st === "em separação";
        const filialPedido = normalizarTexto(p.filial);
        return statusValido && filialPedido === filialAlvo;
      });

      if (fila.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-sm">
            <i class="fa-solid fa-check-double text-2xl mb-2 block text-emerald-600"></i>
            Nenhum caminhão aguardando carregamento em <strong>${filialOperadorLogada}</strong>.
          </div>`;
        return;
      }

      container.innerHTML = fila.map(p => `
        <div class="p-4 rounded-xl border-2 border-slate-200 hover:border-[#007A33] bg-slate-50 flex items-center justify-between gap-3">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-base text-slate-800">Pedido #${p.pedido}</span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">NF ${p.nf || "-"}</span>
            </div>
            <p class="text-xs font-semibold text-slate-600 mt-0.5">${p.cliente || "Cliente"}</p>
            <p class="text-xs font-extrabold ifco-text mt-1">${p.itens || "-"}</p>
          </div>
          <button onclick='abrirRomaneioOperador(${JSON.stringify(p).replace(/'/g, "&apos;")})'
            class="ifco-green text-white text-xs font-extrabold px-4 py-3 rounded-xl shadow-sm">
            Atender <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      `).join("");
    }

    async function abrirRomaneioOperador(pedidoObj, restoring = false, estadoSalvo = null) {
      pedidoAtivoOperador = pedidoObj;
      ativarTelaSempreLigada();

      document.getElementById("opListaContainer").classList.add("hidden");
      document.getElementById("opRomaneioContainer").classList.remove("hidden");

      document.getElementById("opRomPedido").textContent = pedidoObj.pedido;
      document.getElementById("opRomNf").textContent = pedidoObj.nf || "-";
      document.getElementById("opRomCliente").textContent = pedidoObj.cliente || "-";

      npsSelecionado = (estadoSalvo && estadoSalvo.nps) ? estadoSalvo.nps : "";
      fotoBase64Resumo = (estadoSalvo && estadoSalvo.foto) ? estadoSalvo.foto : "";

      if (fotoBase64Resumo) {
        document.getElementById("opFotoStatus").classList.remove("hidden");
      } else {
        document.getElementById("opFotoStatus").classList.add("hidden");
      }

      document.getElementById("npsLabelTexto").textContent = "";
      document.querySelectorAll(".star-btn").forEach(b => {
        b.classList.remove("text-amber-400");
        b.classList.add("text-slate-300");
      });
      if (npsSelecionado) {
        selecionarEstrelas(Number(npsSelecionado), false);
      }

      const savedChecks = (estadoSalvo && Array.isArray(estadoSalvo.checkboxes)) ? estadoSalvo.checkboxes : [];
      const partes = String(pedidoObj.itens || "").split("|").map(s => s.trim()).filter(Boolean);
      document.getElementById("opChecklistItens").innerHTML = partes.map((item, idx) => `
        <label class="flex items-center gap-3 p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50 cursor-pointer">
          <input type="checkbox" ${savedChecks[idx] ? "checked" : ""} onchange="salvarEstadoRomaneioLocal()" class="w-5 h-5 accent-[#007A33]" />
          <span class="text-sm font-extrabold text-slate-800">${item}</span>
        </label>
      `).join("");

      salvarEstadoRomaneioLocal();

      if (!restoring && strLower(pedidoObj.status) === "aguardando separação") {
        await enviarPost({
          action: "iniciar_separacao",
          pedido: pedidoObj.pedido,
          t_sep_ini: horaAtualFormatada()
        });
      }
    }

    function fecharRomaneioOperador() {
      liberarTelaSempreLigada();
      localStorage.removeItem("ifco_v3_op_ativo");
      pedidoAtivoOperador = null;
      document.getElementById("opRomaneioContainer").classList.add("hidden");
      document.getElementById("opListaContainer").classList.remove("hidden");
    }

    function selecionarEstrelas(nota, salvar = true) {
      npsSelecionado = String(nota);
      const legendas = {
        1: "1 Estrela — Muito Ruim",
        2: "2 Estrelas — Ruim",
        3: "3 Estrelas — Regular",
        4: "4 Estrelas — Bom",
        5: "5 Estrelas — Excelente!"
      };

      const botoes = document.querySelectorAll(".star-btn");
      botoes.forEach((btn, index) => {
        if (index < nota) {
          btn.classList.remove("text-slate-300");
          btn.classList.add("text-amber-400");
        } else {
          btn.classList.remove("text-amber-400");
          btn.classList.add("text-slate-300");
        }
      });

      document.getElementById("npsLabelTexto").textContent = legendas[nota] || "";
      if (salvar) salvarEstadoRomaneioLocal();
    }

    function processarFotoOperador(event) {
      const file = event.target.files[0];
      if (!file) return;
      fotoBase64Resumo = `Foto anexada (${file.name} - ${horaAtualFormatada()})`;
      document.getElementById("opFotoStatus").classList.remove("hidden");
      salvarEstadoRomaneioLocal();
    }

    async function concluirCarregamentoOperador() {
      if (!pedidoAtivoOperador) return;
      if (!npsSelecionado) {
        return mostrarToast("Peça para o motorista tocar nas estrelas para avaliar!", true);
      }

      const ok = await enviarPost({
        action: "concluir",
        pedido: pedidoAtivoOperador.pedido,
        t_fim: horaAtualFormatada(),
        nps: npsSelecionado,
        foto: fotoBase64Resumo || "Sem foto"
      });

      if (ok) {
        mostrarToast("Carregamento finalizado com sucesso!");
        fecharRomaneioOperador();
        setTimeout(carregarDados, 1200);
      }
    }

    // =========================================================================
    // UTILITÁRIOS
    // =========================================================================
    function horaAtualFormatada() {
      const d = new Date();
      return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function toggleSync(ativo) {
      const el = document.getElementById("syncIndicator");
      if (ativo) {
        el.classList.remove("hidden");
        el.classList.add("flex");
      } else {
        el.classList.add("hidden");
        el.classList.remove("flex");
      }
    }

    function mostrarToast(msg, erro = false) {
      const t = document.getElementById("toast");
      const icon = document.getElementById("toastIcon");
      document.getElementById("toastMsg").textContent = msg;
      icon.className = erro ? "fa-solid fa-circle-exclamation text-amber-400" : "fa-solid fa-circle-check text-emerald-400";
      t.classList.remove("hidden");
      t.classList.add("flex");
      setTimeout(() => {
        t.classList.add("hidden");
        t.classList.remove("flex");
      }, 3200);
    }
  </script>
